[project]
name = "sextant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ShowzZzie", email = "showzzzie@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
sextant = "sextant:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.mypy]
strict = true